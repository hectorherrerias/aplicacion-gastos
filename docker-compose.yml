services:
  gastospro:
    build:
      context: .
      dockerfile: Dockerfile
    image: gastospro:latest
    container_name: gastospro-app
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3001}:3000"
    # Secrets and admin credentials live in .env (not committed). See .env.example
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATA_DIR=/app/data
      - DATABASE_FILE=/app/data/database.sqlite
      - TZ=${TZ:-Europe/Madrid}
    volumes:
      # Persistent SQLite storage + daily backups (./data/backups)
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
